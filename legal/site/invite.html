<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0D0F">
<meta name="robots" content="noindex">
<title>Join Emigo</title>
<meta name="description" content="Your closest friends' photos, live on your home screen.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Emigo">
<meta property="og:title" content="Come add me on Emigo">
<meta property="og:description" content="Your closest friends' photos, live on your home screen.">
<meta property="og:image" content="https://emigo.live/emigo-icon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/emigo-icon.png">
<style>
  :root {
    --bg: #0e0d0f;
    --card: #19181a;
    --hairline: rgba(255, 255, 255, 0.10);
    --cream: #f3efe6;
    --muted: #a39d9b;
    --accent: #fffb0a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 28px 24px;
  }
  .icon {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    border: 1px solid var(--hairline);
    display: block;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 28px 0 0;
    max-width: 340px;
    overflow-wrap: anywhere;
  }
  p.lead {
    margin: 12px 0 0;
    max-width: 320px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
  }
  .button {
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 240px;
    height: 54px;
    padding: 0 28px;
    border-radius: 27px;
    background: var(--accent);
    color: #111;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .button:active { opacity: 0.85; }
  .soon {
    margin-top: 36px;
    min-width: 240px;
    height: 54px;
    padding: 0 28px;
    border-radius: 27px;
    border: 1px solid var(--hairline);
    background: var(--card);
    color: var(--muted);
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  [hidden] { display: none !important; }
  footer {
    padding: 20px 28px 32px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="/emigo-icon.png" alt="Emigo" width="96" height="96">
  <h1 id="headline">Come add me on Emigo</h1>
  <p class="lead">Photos from the people you love, live on your home screen.</p>
  <a id="play" class="button" href="https://play.google.com/store/apps/details?id=com.emigo.app">Get it on Google Play</a>
  <div id="soon" class="soon" hidden>iPhone version coming soon</div>
</main>
<footer>
  <a href="/privacy-policy">Privacy</a>·<a href="/terms-of-service">Terms</a>
</footer>
<script src="/invite.js"></script>
</body>
</html>
